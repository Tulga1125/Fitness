server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Safari's fallback probes for a home-screen icon, and the old file name, which some phones
    # cached before the icon was fixed: all of them get the current icon.
    location ~ ^/apple-touch-icon(-precomposed|-\d+x\d+)?\.png$ { return 302 /apple-touch-icon-v2.png; }
    location = /favicon.png { return 302 /favicon-v2.png; }
    location = /favicon.ico { return 302 /favicon-v2.png; }
    location = /icon-512.png { return 302 /icon-512-v2.png; }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(png|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
