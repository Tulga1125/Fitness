server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Safari's fallback probes for a home-screen icon, and the old file name, which some phones
    # cached before the icon was fixed: all of them get the current icon.
    location ~ ^/apple-touch-icon(-precomposed|-\d+x\d+)?\.png$ { return 302 /apple-touch-icon-v2.png; }
    location = /favicon.png { return 302 /favicon-v2.png; }
    location = /favicon.ico { return 302 /favicon-v2.png; }
    location = /icon-512.png { return 302 /icon-512-v2.png; }

    # Live status for the Status section on the page. Each path proxies one service's health
    # URL, so the browser reads the real response code from this origin (not every service
    # sends CORS headers, and Railway's API only allows railway.com). Hostnames go through a
    # variable so nginx resolves them per request, not once at start-up: the Cloudflare and
    # Railway edge addresses behind them change. A service that does not answer within the
    # timeouts comes back as a 502 or 504, which the page shows as down.
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    location /status/ {
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 8s;
        proxy_http_version 1.1;   # Cloudflare refuses HTTP/1.0 (426 Upgrade Required), nginx's default
        proxy_ssl_server_name on;
        # Send none of the visitor's headers upstream. This page sits behind Cloudflare, so every
        # request arrives with CF-Connecting-IP, X-Forwarded-For and friends, and Cloudflare in
        # front of the services rejects a request that carries them (403, or error 1000).
        proxy_pass_request_headers off;
        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent "tagent-status";
        proxy_set_header Accept "*/*";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;   # ours below wins, so Cloudflare never caches a status answer
        proxy_hide_header Expires;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # The two apps this container serves itself: the check is that their files are deployed.
        location = /status/landing { try_files /index.html =404; }
        location = /status/tusgal { try_files /tusgal/index.html =404; }
        location = /status/fitness { set $u https://fitness.tagent.space/api/health; proxy_pass $u; }
        location = /status/nomadex { set $u https://project1.tagent.space/api/health; proxy_pass $u; }
        location = /status/sonor-parts { set $u https://22.sonorgroup.mn/api/health; proxy_pass $u; }
        # The mining app sends anonymous visitors to its login page; that page is the health check.
        location = /status/sonor-mining { set $u https://mining.sonorgroup.mn/login; proxy_pass $u; }
        # Railway's public platform status: an unauthenticated GraphQL query.
        location = /status/railway {
            set $u https://backboard.railway.app/graphql/v2;
            proxy_method POST;
            proxy_set_header Content-Type "application/json";
            proxy_set_body '{"query":"{ platformStatus { isStable } }"}';
            proxy_pass $u;
        }
    }

    # Тусгал: the private preview page in tusgal/, served at /tusgal/ (and on its own hostname
    # by the server block below). Its _headers file asked for no indexing, no framing and no
    # referrer; those are the add_header lines. add_header in a location replaces the server's
    # set, hence the repeats.
    location = /tusgal { return 301 /tusgal/; }
    location /tusgal/ {
        alias /usr/share/nginx/html/tusgal/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(png|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}

# tusgal.tagent.space: the same page at the hostname its README asks for. It answers as soon as
# Railway knows the hostname (Settings > Networking > Custom Domain on the landing service) and
# Cloudflare has the proxied CNAME to this service; until then only /tusgal/ above is reachable.
server {
    listen 8080;
    listen [::]:8080;
    server_name tusgal.tagent.space;
    root /usr/share/nginx/html/tusgal;
    index index.html;
    absolute_redirect off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
